          - lst/concepts/types.md
          - lst/concepts/modifying-data.md
          - lst/concepts/sources.md
          - lst/concepts/game-modes.md
          - lst/concepts/data-controls.md
          - lst/concepts/prerequisites.md
          - lst/concepts/rule-toggles.md
          - lst/concepts/bonuses.md
          - lst/concepts/granting.md
          - lst/concepts/granting-spells.md
          - lst/concepts/display-text.md
          - lst/concepts/choosers.md
          - lst/concepts/archetypes.md
          - lst/concepts/declaring-variables.md
          - lst/concepts/variables-and-formulas.md
      - File types:
